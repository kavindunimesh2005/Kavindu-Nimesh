services:
  # Fullstack Web Service (Frontend + Backend + CMS)
  - type: web
    name: kavindu-portfolio
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
